name: prune-old-releases

# 一次性清理：删掉 1.1.0 之前发过的全部 Release（含草稿）和对应的 git tag，
# 把 1.1.0 钉成 Latest，并清掉排障期间临时放上去的 Release 正文。
# 本机没有 GitHub 凭据，只能借 GITHUB_TOKEN，所以做成工作流，由 `prune3` 标签触发。

on:
  push:
    tags: ["prune3"]

permissions:
  contents: write

env:
  KEEP: "v1.0.0 v1.1.0"

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 删除旧 Release（含草稿）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 草稿 Release 用 tag 名查不到，只能按 id 删；同一个 tag 可能挂着好几条草稿
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | "\(.id) \(.tag_name)"' > releases.txt
          cat releases.txt
          while read -r id tag; do
            case " $KEEP " in *" $tag "*) echo "keep $tag"; continue;; esac
            echo "delete $tag ($id)"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true
          done < releases.txt

      - name: 删除旧 tag
        run: |
          for tag in $(git ls-remote --tags origin | sed 's#.*refs/tags/##' | sed 's/\^{}//'); do
            case " $KEEP " in *" $tag "*) continue;; esac
            git push origin --delete "$tag" || true
          done
          git ls-remote --tags origin

      - name: 1.1.0 钉成 Latest，清掉正文
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.0" \
            -f make_latest=true -f body="" || true

      - name: 完成信号
        run: |
          git tag -f prune3-done
          git push -f origin refs/tags/prune3-done
