name: cleanup

# 一次性收尾：把排障期间写进 Release 正文的诊断内容还原掉。
# 由 cleanup1 标签触发；跑完打 cleanup-done，本机 ls-remote 就能看到。

on:
  push:
    tags: ["cleanup1"]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 还原 Release 正文
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 注意：PATCH /releases/tags/{tag} 是 404，只有按数字 id 才改得动
          id100=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" --jq .id)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id100" \
            -f body="版本号重排：这一版原本是 2.3.0，代码一致，只把版本号改成 1.0.0。" >/dev/null
          id110=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.0" --jq .id)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id110" -f body="" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | "\(.tag_name) latest_draft=\(.draft) body_len=\(.body|length)"'

      - name: 完成信号
        run: |
          git tag -f cleanup-done
          git push -f origin refs/tags/cleanup-done
