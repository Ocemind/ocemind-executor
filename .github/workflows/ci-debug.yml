name: ci-debug

# 一次性排障：本机拿不到 Actions 日志（需要仓库 admin），所以照着 release.yml
# 的 Windows 那段把构建重跑一遍，把编译输出截一段推到 ci-debug-log 分支，
# 之后用匿名 contents API 读回来。查完把工作流和那条分支一起删掉。

on:
  push:
    tags: ["ci-debug"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - name: 打包 Python sidecar
        run: python tools/build_sidecar.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 前端依赖（只有 Tauri CLI）
        working-directory: desktop
        run: npm ci

      - name: 规范化签名私钥
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          key="${RAW_KEY//$'\r'/}"
          printf '%s' "$key" > "$RUNNER_TEMP/updater.key"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<__OCEMIND_KEY__"
            cat "$RUNNER_TEMP/updater.key"
            echo
            echo "__OCEMIND_KEY__"
          } >> "$GITHUB_ENV"

      - name: 构建（只编译，不发版）
        id: build
        shell: bash
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OCEMIND_UPDATE_TOKEN: ${{ secrets.OCEMIND_UPDATE_TOKEN }}
        run: |
          set +e
          npm run tauri build -- --config src-tauri/tauri.release.windows.conf.json \
            > build.log 2>&1
          code=$?
          echo "exit=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tail -c 200000 build.log > log-tail.txt
          exit $code

      - name: 把日志推回仓库
        if: always()
        shell: bash
        run: |
          git config user.name "ci-debug"
          git config user.email "ci-debug@local"
          cp desktop/log-tail.txt ci-debug-log.txt
          git checkout -B ci-debug-log
          git add ci-debug-log.txt
          git commit -m "ci-debug log" || true
          git push --force origin ci-debug-log
