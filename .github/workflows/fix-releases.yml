name: fix-releases

# 一次性修复：v1.0.0 的 Release 是手工预建的（零资产），tauri-action 接管不了。
# 本机拿不到 Actions 日志，所以把诊断结果写进 v1.1.0 的 Release 正文，
# 匿名读 Release 页面就能看到。跑完打 fix2-done 标签当信号。

on:
  push:
    tags: ["fix2"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 诊断并删除
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "=== before ==="
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
              --jq '.[] | "\(.id) \(.tag_name) draft=\(.draft) pre=\(.prerelease) author=\(.author.login) assets=\(.assets|length)"'
            echo
            echo "=== delete by tag ==="
            gh release delete v1.0.0 --yes 2>&1 || echo "delete-by-tag failed: $?"
            echo
            echo "=== delete by id ==="
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
              --jq '.[] | select(.tag_name=="v1.0.0") | .id' | head -1)
            echo "found id=$id"
            if [ -n "$id" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" 2>&1 || echo "delete-by-id failed: $?"
            fi
            echo
            echo "=== after ==="
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
              --jq '.[] | "\(.id) \(.tag_name) draft=\(.draft) assets=\(.assets|length)"' || true
          } > diag.txt 2>&1
          cat diag.txt

      - name: 诊断写进 1.1.0 正文
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit v1.1.0 --notes-file diag.txt || true

      - name: 完成信号
        run: |
          git tag -f fix2-done
          git push -f origin refs/tags/fix2-done
