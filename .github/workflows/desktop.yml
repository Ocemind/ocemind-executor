name: desktop

# 只手动跑，用来验证构建链路出不出包。发版走 release.yml：
# 两边都挂在 v* 标签上的话，同一次发版会把两个包各打一遍。
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 取随包分发的工具
        # yt-dlp 会被编进 sidecar；ffmpeg 由 Tauri 当资源拷进安装包。
        run: |
          python -m pip install yt-dlp
          python tools/fetch_vendor.py

      - uses: dtolnay/rust-toolchain@stable

      - name: 打包 Python sidecar
        run: python tools/build_sidecar.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 前端依赖（只有 Tauri CLI）
        working-directory: desktop
        run: npm ci

      - name: 构建安装包
        working-directory: desktop
        run: npm run build:windows

      - name: 打包便携版
        run: python tools/make_portable_desktop.py

      - uses: actions/upload-artifact@v4
        with:
          name: ocemind-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            dist/Ocemind-portable.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev ffmpeg libfuse2t64 libpython3.12-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 取随包分发的工具
        # 只装 yt-dlp（编进 sidecar）。Linux 的 ffmpeg 走系统包，不随包分发：
        # 共享版 ffmpeg 的 .so 在 lib/ 下，只拷 bin/ 拿到的是一堆跑不起来的二进制。
        run: python -m pip install yt-dlp

      - uses: dtolnay/rust-toolchain@stable

      - name: 打包 Python sidecar
        run: python tools/build_sidecar.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 前端依赖（只有 Tauri CLI）
        working-directory: desktop
        run: npm ci

      - name: 构建 AppImage
        working-directory: desktop
        run: npm run build:linux

      - uses: actions/upload-artifact@v4
        with:
          name: ocemind-linux
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
