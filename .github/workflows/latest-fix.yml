name: latest-fix

# releases/latest 被 1.0.0 抢了（它比 1.1.0 后创建），更新地址会 404。
# 这里把 1.1.0 钉成 Latest，并清掉排障时写进去的 Release 正文。
# 由 latestfix 标签触发；失败时把报错写成 ::error::。

on:
  push:
    tags: ["latestfix"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 钉 Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.0" \
            -f make_latest=true 2>&1) || {
            msg=$(printf '%s' "$out" | tr '\n' ' ' | head -c 900)
            echo "::error title=make-latest-failed::$msg"
            exit 1
          }
          echo "$out" | head -c 400
          gh release edit v1.1.0 --notes "" || true
          echo "latest is:"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
          gh release list --limit 5
