name: release

# 打 v* 标签才出正式包：Windows 出 MSI，Linux 出 AppImage（deb 不能自更新）。
# 两个平台都会生成签名过的 latest.json + .sig，供应用内「检查更新」使用。
# 需要在仓库 Secrets 里配：
#   TAURI_SIGNING_PRIVATE_KEY          —— ~/.tauri/ocemind-updater.key 的内容
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD —— 生成密钥时设的密码（没设就留空）
#   OCEMIND_UPDATE_TOKEN               —— 可选。仓库是公开的就不用配；哪天改回
#                                         私有，配一个只读 contents 令牌编进包里
# 私钥不许进仓库，丢了就再也签不出能更新的包。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - name: 打包 Python sidecar
        run: python tools/build_sidecar.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 前端依赖（只有 Tauri CLI）
        working-directory: desktop
        run: npm ci

      - name: 规范化签名私钥
        # 从记事本复制过来的密钥每行末尾带 CR，minisign 解不开
        # （failed to decode secret key: Invalid symbol 13）。这里统一去掉。
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          key="${RAW_KEY//$'\r'/}"
          printf '%s' "$key" > "$RUNNER_TEMP/updater.key"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<__OCEMIND_KEY__"
            cat "$RUNNER_TEMP/updater.key"
            echo
            echo "__OCEMIND_KEY__"
          } >> "$GITHUB_ENV"

      - name: 构建并发布 MSI
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OCEMIND_UPDATE_TOKEN: ${{ secrets.OCEMIND_UPDATE_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Ocemind 内容执行器 ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.release.windows.conf.json

  linux:
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev ffmpeg libfuse2t64 libpython3.12-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - name: 打包 Python sidecar
        run: python tools/build_sidecar.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 前端依赖（只有 Tauri CLI）
        working-directory: desktop
        run: npm ci

      - name: 规范化签名私钥
        # 从记事本复制过来的密钥每行末尾带 CR，minisign 解不开
        # （failed to decode secret key: Invalid symbol 13）。这里统一去掉。
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          key="${RAW_KEY//$'\r'/}"
          printf '%s' "$key" > "$RUNNER_TEMP/updater.key"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<__OCEMIND_KEY__"
            cat "$RUNNER_TEMP/updater.key"
            echo
            echo "__OCEMIND_KEY__"
          } >> "$GITHUB_ENV"

      - name: 构建并发布 AppImage
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OCEMIND_UPDATE_TOKEN: ${{ secrets.OCEMIND_UPDATE_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Ocemind 内容执行器 ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.release.linux.conf.json

  # tauri-action 生成 latest.json 时用 productName 拼文件名去匹配资产，GitHub 会把
  # 资产名里的空格换成 `.`、删掉中文，导致 Windows 条目被静默丢弃。这里在两边都发完
  # 之后，按 Release 里的真实资产名重建 latest.json，两个平台都写进去。
  manifest:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 重建 latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if ! python tools/make_latest_json.py "${{ github.ref_name }}" latest.json 2>&1 | tee manifest.log; then
            msg=$(tail -c 1200 manifest.log | tr '\n' ' ')
            echo "::error title=生成 latest.json 失败::${msg}"
            exit 1
          fi

      - name: 上传 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" latest.json --clobber
