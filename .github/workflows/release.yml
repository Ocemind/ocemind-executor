name: release

# 打 v* 标签才出正式包：Windows 出 MSI，Linux 出 AppImage（deb 不能自更新）。
# 两个平台都会生成签名过的 latest.json + .sig，供应用内「检查更新」使用。
# 需要在仓库 Secrets 里配：
#   TAURI_SIGNING_PRIVATE_KEY          —— ~/.tauri/ocemind-updater.key 的内容
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD —— 生成密钥时设的密码（没设就留空）
#   OCEMIND_UPDATE_TOKEN               —— 只读 contents 的细粒度令牌，构建时
#                                         编进安装包，用来读私有仓库的 release
# 私钥不许进仓库，丢了就再也签不出能更新的包。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - name: 打包 Python sidecar
        run: python tools/build_sidecar.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 前端依赖（只有 Tauri CLI）
        working-directory: desktop
        run: npm ci

      - name: 构建并发布 MSI
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OCEMIND_UPDATE_TOKEN: ${{ secrets.OCEMIND_UPDATE_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Ocemind 内容执行器 ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.release.windows.conf.json

  linux:
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev ffmpeg libfuse2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - name: 打包 Python sidecar
        run: python tools/build_sidecar.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 前端依赖（只有 Tauri CLI）
        working-directory: desktop
        run: npm ci

      - name: 构建并发布 AppImage
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OCEMIND_UPDATE_TOKEN: ${{ secrets.OCEMIND_UPDATE_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Ocemind 内容执行器 ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.release.linux.conf.json
