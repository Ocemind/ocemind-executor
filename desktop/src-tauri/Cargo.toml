[package]
name = "ocemind-desktop"
version = "2.4.0"
description = "Ocemind 内容执行器桌面壳"
authors = ["Ocemind"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ocemind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 只为打开 socks 特性：Cargo 会把特性并给 tauri-plugin-updater 用的那份
# reqwest，更新才走得通设置里的 SOCKS 代理（它自己没开这个特性）
reqwest = { version = "0.13", default-features = false, features = ["socks"] }
log = "0.4"
opener = { version = "0.7", features = ["reveal"] }
ureq = "2.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
