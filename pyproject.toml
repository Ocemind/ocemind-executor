[project]
name = "ocemind-executor"
version = "2.3.3"
description = "Ocemind 内容执行器 —— 下载、转写、处理、发布，一个人一台机器"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
# 自动登录和抖音解析用。刻意不放进主依赖：exe 要保持轻量，不带 Playwright。
# 只有从源码跑时才需要 `pip install -e ".[auth]"`；抖音解析还需要本机 Chrome。
auth = ["playwright>=1.40"]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not network'"
markers = [
    "network: 需要真实联网/真 cookie 的测试，默认跳过（-m network 才跑）",
]
